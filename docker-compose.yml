services:
  db:
    image: postgres:15-alpine
    container_name: eventhub_postgres
    restart: always
    environment:
      POSTGRES_DB: eventhub_db
      POSTGRES_USER: eventhub_user
      POSTGRES_PASSWORD: eventhub_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: